<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <title>Brain</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #f4f4f4;
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    }
    h1 { font-size: 28px; margin: 8px 0 4px; }
    p { color: #bdbdbd; margin: 0 0 16px; }
    button, textarea, input {
      font: inherit;
      color: inherit;
      width: 100%;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 22px 16px;
      margin: 8px 0;
      background: #f4f4f4;
      color: #111;
      font-weight: 650;
    }
    button.secondary { background: #2a2a2a; color: #f4f4f4; }
    button.recording { background: #c0392b; color: white; }
    button:disabled { opacity: 0.5; }
    textarea, input[type="password"] {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
    }
    textarea { min-height: 140px; resize: vertical; }
    #status { min-height: 1.4em; margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main id="setup" class="hidden">
    <h1>Brain</h1>
    <p>Paste a token that can write to MariposaGentil/Brain. It stays on this phone.</p>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <button id="save-token" type="button">Save on this phone</button>
  </main>

  <main id="app" class="hidden">
    <h1>Inbox</h1>
    <p>A photo, a note, or a voice message is filed on its own.</p>
    <button id="photo" type="button">Take a photo</button>
    <button id="note-open" type="button">Write a note</button>
    <button id="voice" type="button">Record voice</button>
    <div id="composer" class="hidden">
      <textarea id="note" placeholder="Write the note"></textarea>
      <button id="send-note" type="button">Send to inbox</button>
    </div>
    <p id="status" role="status"></p>
    <button id="forget" class="secondary" type="button">Forget token</button>
  </main>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden>

  <script>
    const OWNER = "MariposaGentil";
    const REPO = "Brain";
    const BRANCH = "main";
    const TOKEN_KEY = "brain-github-token";

    const setup = document.querySelector("#setup");
    const app = document.querySelector("#app");
    const status = document.querySelector("#status");
    const camera = document.querySelector("#camera");
    const composer = document.querySelector("#composer");
    const noteBox = document.querySelector("#note");
    const voiceButton = document.querySelector("#voice");

    let token = localStorage.getItem(TOKEN_KEY) || "";
    let recorder = null;
    let chunks = [];
    let stream = null;

    function show(which) {
      setup.classList.toggle("hidden", which !== "setup");
      app.classList.toggle("hidden", which !== "app");
    }

    function say(text) { status.textContent = text; }

    function stamp() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      const rand = String(Math.floor(1000 + Math.random() * 9000));
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${rand}`;
    }

    function slug(text) {
      const words = text.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(/\s+/).slice(0, 4).join("-");
      return words || "note";
    }

    function bytesToBase64(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      }
      return btoa(binary);
    }

    function textToBase64(text) {
      return bytesToBase64(new TextEncoder().encode(text));
    }

    function decodeContent(b64) {
      const clean = b64.replace(/\n/g, "");
      const bytes = Uint8Array.from(atob(clean), (c) => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    async function github(path, options) {
      const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2026-03-10",
          ...(options.headers || {}),
        },
      });
      if (response.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        token = "";
        show("setup");
        throw new Error("The token was rejected. Paste a new one.");
      }
      return response;
    }

    async function putFile(path, base64content, message) {
      const response = await github(path, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, content: base64content, branch: BRANCH }),
      });
      if (!response.ok) {
        const body = await response.text();
        throw new Error(body);
      }
    }

    async function appendIndex(path, line) {
      for (let attempt = 0; attempt < 2; attempt += 1) {
        const got = await github(path, { method: "GET" });
        let text = "";
        let sha = "";
        if (got.status === 404) {
          text = `# Index\n\n${line}\n`;
        } else if (!got.ok) {
          throw new Error(await got.text());
        } else {
          const json = await got.json();
          sha = json.sha;
          text = decodeContent(json.content);
          if (!text.endsWith("\n")) text += "\n";
          text += `${line}\n`;
        }
        const body = { message: `index ${path}`, content: textToBase64(text), branch: BRANCH };
        if (sha) body.sha = sha;
        const put = await github(path, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (put.ok) return;
        if (put.status !== 409 || attempt === 1) throw new Error(await put.text());
      }
    }

    function inboxNote(title, body, originName) {
      let markdown = `---\ntags:\n  - capture\n---\n\n# ${title}\n`;
      if (body) markdown += `\n${body}\n`;
      if (originName) markdown += `\n- Origin: [${originName}](../originals/${originName})\n`;
      return markdown;
    }

    async function fileInbox(title, body, originName, description) {
      const id = `${stamp()}-${slug(title)}`;
      const noteName = `${id}.md`;
      await putFile(
        `personal/inbox/${noteName}`,
        textToBase64(inboxNote(title, body, originName)),
        `add inbox ${noteName}`,
      );
      await appendIndex(
        "personal/inbox/INDEX.md",
        `- [${title}](${noteName}) — ${description}`,
      );
    }

    async function fileOriginal(name, bytes) {
      await putFile(`personal/originals/${name}`, bytesToBase64(bytes), `add original ${name}`);
      await appendIndex(
        "personal/originals/INDEX.md",
        `- [${name}](${name}) — Uploaded from the phone. Removed after 30 days.`,
      );
    }

    function lock(on) {
      for (const id of ["photo", "note-open", "voice", "send-note", "forget"]) {
        document.getElementById(id).disabled = on;
      }
    }

    document.querySelector("#save-token").onclick = () => {
      token = document.querySelector("#token").value.trim();
      if (!token) return;
      localStorage.setItem(TOKEN_KEY, token);
      document.querySelector("#token").value = "";
      show("app");
      say("");
    };

    document.querySelector("#forget").onclick = () => {
      localStorage.removeItem(TOKEN_KEY);
      token = "";
      show("setup");
    };

    document.querySelector("#photo").onclick = () => camera.click();

    camera.onchange = async () => {
      const file = camera.files && camera.files[0];
      camera.value = "";
      if (!file) return;
      lock(true);
      say("Sending the photo…");
      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const name = `${stamp()}-photo.jpg`;
        await fileOriginal(name, bytes);
        await fileInbox("Photo", "", name, "Photo from the phone.");
        say("In your inbox.");
      } catch (error) {
        say(error.message);
      } finally {
        lock(false);
      }
    };

    document.querySelector("#note-open").onclick = () => {
      composer.classList.toggle("hidden");
      if (!composer.classList.contains("hidden")) noteBox.focus();
    };

    document.querySelector("#send-note").onclick = async () => {
      const text = noteBox.value.trim();
      if (!text) return;
      const lines = text.split("\n");
      const title = lines[0].slice(0, 80);
      const body = lines.slice(1).join("\n").trim();
      lock(true);
      say("Sending the note…");
      try {
        await fileInbox(title, body, "", title);
        noteBox.value = "";
        composer.classList.add("hidden");
        say("In your inbox.");
      } catch (error) {
        say(error.message);
      } finally {
        lock(false);
      }
    };

    voiceButton.onclick = async () => {
      if (recorder && recorder.state === "recording") {
        recorder.stop();
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (error) {
        say("The microphone is blocked.");
        return;
      }
      const mime = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "audio/webm";
      chunks = [];
      recorder = new MediaRecorder(stream, { mimeType: mime });
      recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach((track) => track.stop());
        voiceButton.textContent = "Record voice";
        voiceButton.classList.remove("recording");
        lock(true);
        say("Sending the voice message…");
        try {
          const blob = new Blob(chunks, { type: mime });
          const ext = mime === "audio/mp4" ? "m4a" : "webm";
          const name = `${stamp()}-voice.${ext}`;
          const bytes = new Uint8Array(await blob.arrayBuffer());
          await fileOriginal(name, bytes);
          await fileInbox("Voice message", "", name, "Voice message from the phone.");
          say("In your inbox.");
        } catch (error) {
          say(error.message);
        } finally {
          lock(false);
          recorder = null;
        }
      };
      recorder.start();
      voiceButton.textContent = "Stop and send";
      voiceButton.classList.add("recording");
      say("Recording…");
    };

    show(token ? "app" : "setup");
  </script>
</body>
</html>
