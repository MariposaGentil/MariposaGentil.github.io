<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-title" content="Brain Inbox">
  <title>Brain Inbox</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="/assets/css/styling.max.css">
  <script>
    (function () {
      const cookie = document.cookie.split("; ").find((row) => row.startsWith("theme="));
      const value = cookie ? cookie.split("=")[1] : "";
      const dark = value ? value === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) return;
      const root = document.documentElement;
      const style = getComputedStyle(root);
      root.style.setProperty("--theme-bg-color", style.getPropertyValue("--light-theme-bg-color"));
      root.style.setProperty("--theme-content-color", style.getPropertyValue("--light-theme-content-color"));
      root.style.setProperty("--theme-content-color-lighter", style.getPropertyValue("--light-theme-content-color-lighter"));
      const theme = document.querySelector('meta[name="theme-color"]');
      if (theme) theme.setAttribute("content", "#fdf6e3");
    })();
  </script>
  <style>
    .body-index {
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      container-type: inline-size;
    }
    .page-title h1 {
      font-size: min(150%, 17cqi);
      white-space: nowrap;
    }
    .page-description { margin-bottom: 0; }
    .body-index hr {
      height: 0;
      border: 0;
      border-top: 1px solid var(--theme-content-color-lighter);
      margin: 5.5px 0;
    }
    .actions {
      display: flex;
      flex-direction: row;
      gap: 10px;
      margin-top: 5.5px;
    }
    .actions button {
      flex: 1;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--theme-content-color-lighter);
      border-radius: 12px;
      background: transparent;
      color: var(--theme-content-color);
    }
    .actions button[aria-pressed="true"] { border-color: var(--theme-content-color); }
    .actions button.recording { border-color: #f85149; color: #f85149; }
    .actions .material-symbols-outlined { font-size: 32px; }
    #preview {
      display: block;
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      margin-top: 12px;
    }
    #composer { width: 100%; margin: 0; padding: 0; }
    textarea, input[type="password"], input[type="url"] {
      display: block;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      margin: 12px 0 0;
      background: transparent;
      color: var(--theme-content-color);
      border: 1px solid var(--theme-content-color-lighter);
      border-radius: 8px;
      padding: 12px;
    }
    textarea { min-height: 140px; resize: vertical; }
    .send-row {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 10px;
      margin-top: 12px;
    }
    button.wide {
      width: 100%;
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 8px;
      border: 0;
      font-family: "Libre Baskerville", Baskerville, Georgia, serif;
    }
    .send-row button.upload { width: auto; flex: 1; margin-top: 0; }
    #clear {
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--theme-content-color-lighter);
      border-radius: 12px;
      background: transparent;
      color: var(--theme-content-color);
    }
    #clear.hidden { display: none; }
    button.upload { opacity: 1; }
    button.upload.idle,
    button.upload:disabled {
      background: #9a9a9a;
      color: #fff;
      border: 0;
      opacity: 1;
    }
    button.upload.ready {
      background: #fff;
      color: #111;
      border: 1px solid #111;
    }
    button.upload.failed { background: #c44536; color: #fff; border: 0; }
    #error {
      margin: 12px 0 0;
      text-align: center;
      color: #c44536;
      hyphens: none;
    }
    button#save-token {
      border: 1px solid var(--theme-content-color-lighter);
      background: transparent;
      color: var(--theme-content-color);
    }
    #status { min-height: 1.4em; margin: 12px 0 0; text-align: center; }
    details.danger { margin-top: 28px; }
    details.danger summary {
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--theme-content-color-lighter);
      list-style: none;
    }
    details.danger summary::-webkit-details-marker { display: none; }
    details.danger[open] summary { transform: rotate(180deg); }
    .danger-title {
      margin: 16px 0 8px;
      text-align: center;
      color: #f85149;
      font-weight: bold;
      hyphens: none;
    }
    button#forget {
      border: 1px solid #f85149;
      background: transparent;
      color: #f85149;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="body-index">
  <div class="page-title"><h1>Brain Inbox</h1></div>
  <div class="page-description" id="lede">Upload a file to your second brain</div>
  <hr>

  <main id="setup" class="hidden">
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <button id="save-token" class="wide" type="button">Save on this phone</button>
  </main>

  <main id="app" class="hidden">
    <div class="actions" role="group" aria-label="Capture">
      <button id="photo" type="button" aria-label="Take a photo" aria-pressed="false"><span class="material-symbols-outlined">photo_camera</span></button>
      <button id="library" type="button" aria-label="Choose a photo" aria-pressed="false"><span class="material-symbols-outlined">photo_library</span></button>
      <button id="note-open" type="button" aria-label="Write a note" aria-pressed="false"><span class="material-symbols-outlined">edit_note</span></button>
      <button id="voice" type="button" aria-label="Record voice" aria-pressed="false"><span class="material-symbols-outlined">mic</span></button>
      <button id="clip-open" type="button" aria-label="Clip a link" aria-pressed="false"><span class="material-symbols-outlined">link</span></button>
    </div>
    <img id="preview" class="hidden" alt="">
    <div id="clipper" class="hidden">
      <input id="clip-url" type="url" inputmode="url" autocomplete="off" placeholder="https://…">
    </div>
    <div id="composer" class="hidden">
      <textarea id="note" placeholder="Write the note"></textarea>
    </div>
    <p id="error" class="hidden" role="alert"></p>
    <div class="send-row">
      <button id="upload" class="wide upload idle" type="button" disabled>Upload</button>
      <button id="clear" class="hidden" type="button" aria-label="Remove"><span class="material-symbols-outlined">close</span></button>
    </div>
    <p id="status" role="status"></p>
    <details class="danger">
      <summary class="material-symbols-outlined" aria-label="Danger zone">expand_more</summary>
      <p class="danger-title">⚠️ Danger zone</p>
      <button id="forget" class="wide" type="button">Forget token</button>
    </details>
  </main>
</div>
<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<input id="files" type="file" accept="image/*" hidden>

<script>
  const OWNER = "MariposaGentil";
  const REPO = "Brain";
  const BRANCH = "main";
  const TOKEN_KEY = "brain-github-token";

  const setup = document.querySelector("#setup");
  const app = document.querySelector("#app");
  const lede = document.querySelector("#lede");
  const status = document.querySelector("#status");
  const camera = document.querySelector("#camera");
  const files = document.querySelector("#files");
  const composer = document.querySelector("#composer");
  const clipper = document.querySelector("#clipper");
  const clipBox = document.querySelector("#clip-url");
  const noteBox = document.querySelector("#note");
  const voiceButton = document.querySelector("#voice");
  const uploadButton = document.querySelector("#upload");
  const clearButton = document.querySelector("#clear");
  const errorLine = document.querySelector("#error");
  const preview = document.querySelector("#preview");

  let token = localStorage.getItem(TOKEN_KEY) || "";
  let recorder = null;
  let chunks = [];
  let stream = null;
  let photoFile = null;
  let photoFrom = "";
  let previewUrl = "";
  let voiceTake = null;
  let recording = false;
  let busy = false;
  let outcome = "";

  function show(which) {
    setup.classList.toggle("hidden", which !== "setup");
    app.classList.toggle("hidden", which !== "app");
    lede.textContent = which === "setup"
      ? "Paste a token that can write to MariposaGentil/Brain. It stays on this phone."
      : "Upload a file to your second brain";
  }

  function say(text) { status.textContent = text; }

  function showError(text) {
    errorLine.textContent = text || "";
    errorLine.classList.toggle("hidden", !text);
  }

  function shortError(error) {
    const text = String(error && error.message || "");
    if (text.includes("token was rejected")) return "The token was rejected.";
    if (/Failed to fetch|NetworkError|network/i.test(text)) return "Could not reach GitHub.";
    if (/413|too large/i.test(text)) return "The file is too large.";
    if (/"status":\s*"403"|\b403\b/.test(text)) return "The token cannot write.";
    return "Upload failed.";
  }

  function clipValue() {
    return clipBox.value.trim();
  }

  function ready() {
    return !!(photoFile || noteBox.value.trim() || voiceTake || clipValue());
  }

  function clearSelection() {
    clearPhoto();
    noteBox.value = "";
    composer.classList.add("hidden");
    clipBox.value = "";
    clipper.classList.add("hidden");
    voiceTake = null;
    outcome = "";
    showError("");
    say("");
  }

  function paint() {
    uploadButton.classList.remove("idle", "ready", "failed");
    if (busy || recording || (outcome !== "error" && !ready())) {
      uploadButton.disabled = true;
      uploadButton.classList.add("idle");
    } else if (outcome === "error") {
      uploadButton.disabled = false;
      uploadButton.classList.add("failed");
    } else {
      uploadButton.disabled = false;
      uploadButton.classList.add("ready");
    }
    const canRemove = !busy && !recording && !outcome && ready();
    clearButton.classList.toggle("hidden", !canRemove);
    clearButton.disabled = !canRemove;
    if (canRemove) {
      const side = uploadButton.getBoundingClientRect().height;
      clearButton.style.width = `${side}px`;
      clearButton.style.height = `${side}px`;
    }
    document.querySelector("#photo").setAttribute("aria-pressed", photoFrom === "camera" ? "true" : "false");
    document.querySelector("#library").setAttribute("aria-pressed", photoFrom === "files" ? "true" : "false");
    document.querySelector("#note-open").setAttribute("aria-pressed", noteBox.value.trim() ? "true" : "false");
    voiceButton.setAttribute("aria-pressed", voiceTake ? "true" : "false");
    document.querySelector("#clip-open").setAttribute("aria-pressed", clipValue() ? "true" : "false");
  }

  function stamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    const rand = String(Math.floor(1000 + Math.random() * 9000));
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${rand}`;
  }

  function slug(text) {
    const words = text.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(/\s+/).slice(0, 4).join("-");
    return words || "note";
  }

  function bytesToBase64(bytes) {
    let binary = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    }
    return btoa(binary);
  }

  function textToBase64(text) {
    return bytesToBase64(new TextEncoder().encode(text));
  }

  function decodeContent(b64) {
    const clean = b64.replace(/\n/g, "");
    const bytes = Uint8Array.from(atob(clean), (c) => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  async function github(path, options) {
    const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
      ...options,
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2026-03-10",
        ...(options.headers || {}),
      },
    });
    if (response.status === 401) {
      localStorage.removeItem(TOKEN_KEY);
      token = "";
      show("setup");
      throw new Error("The token was rejected. Paste a new one.");
    }
    return response;
  }

  async function putFile(path, base64content, message) {
    const response = await github(path, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, content: base64content, branch: BRANCH }),
    });
    if (!response.ok) {
      const body = await response.text();
      throw new Error(body);
    }
  }

  async function appendIndex(path, line) {
    for (let attempt = 0; attempt < 2; attempt += 1) {
      const got = await github(path, { method: "GET" });
      let text = "";
      let sha = "";
      if (got.status === 404) {
        text = `# Index\n\n${line}\n`;
      } else if (!got.ok) {
        throw new Error(await got.text());
      } else {
        const json = await got.json();
        sha = json.sha;
        text = decodeContent(json.content);
        if (!text.endsWith("\n")) text += "\n";
        text += `${line}\n`;
      }
      const body = { message: `index ${path}`, content: textToBase64(text), branch: BRANCH };
      if (sha) body.sha = sha;
      const put = await github(path, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (put.ok) return;
      if (put.status !== 409 || attempt === 1) throw new Error(await put.text());
    }
  }

  function inboxNote(title, body, originName, sourceUrl) {
    let markdown = `---\ntags:\n  - capture\n---\n\n# ${title}\n`;
    if (sourceUrl) markdown += `\n- Source: ${sourceUrl}\n`;
    if (body) markdown += `\n${body}\n`;
    if (originName) markdown += `\n- Origin: [${originName}](../personal/originals/${originName})\n`;
    return markdown;
  }

  async function fileInbox(title, body, originName, description, sourceUrl) {
    const id = `${stamp()}-${slug(title)}`;
    const noteName = `${id}.md`;
    await putFile(
      `inbox/${noteName}`,
      textToBase64(inboxNote(title, body, originName, sourceUrl)),
      `add inbox ${noteName}`,
    );
    await appendIndex(
      "inbox/INDEX.md",
      `- [${title}](${noteName}) — ${description}`,
    );
  }

  async function fileOriginal(name, bytes) {
    await putFile(`personal/originals/${name}`, bytesToBase64(bytes), `add original ${name}`);
    await appendIndex(
      "personal/originals/INDEX.md",
      `- [${name}](${name}) — Uploaded from the phone. Removed after 30 days.`,
    );
  }

  function imageExt(file) {
    const known = { jpg: "jpg", jpeg: "jpg", png: "png", gif: "gif", webp: "webp", heic: "heic", heif: "heic" };
    const fromName = (file.name || "").toLowerCase().split(".").pop();
    if (known[fromName]) return known[fromName];
    const fromType = (file.type || "").toLowerCase().replace("image/", "");
    return known[fromType] || "jpg";
  }

  function clearPhoto() {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = "";
    photoFile = null;
    photoFrom = "";
    preview.removeAttribute("src");
    preview.classList.add("hidden");
  }

  function holdPhoto(file, from) {
    if (outcome) clearSelection();
    else clearPhoto();
    photoFile = file;
    photoFrom = from;
    previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.classList.remove("hidden");
    outcome = "";
    showError("");
    say("Photo ready.");
    paint();
  }

  async function sendPhoto(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const name = `${stamp()}-photo.${imageExt(file)}`;
    await fileOriginal(name, bytes);
    await fileInbox("Photo", "", name, "Photo from the phone.");
  }

  async function sendClip(url, text) {
    let title = url;
    let body = "";
    if (text) {
      const lines = text.split("\n");
      title = lines[0].slice(0, 80);
      body = lines.slice(1).join("\n").trim();
    }
    await fileInbox(title, body, "", url, url);
  }

  async function sendNote(text) {
    const lines = text.split("\n");
    const title = lines[0].slice(0, 80);
    const body = lines.slice(1).join("\n").trim();
    await fileInbox(title, body, "", title);
  }

  async function sendVoice(take) {
    const name = `${stamp()}-voice.${take.ext}`;
    const bytes = new Uint8Array(await take.blob.arrayBuffer());
    await fileOriginal(name, bytes);
    await fileInbox("Voice message", "", name, "Voice message from the phone.");
  }

  function lock(on) {
    for (const id of ["photo", "library", "note-open", "voice", "clip-open"]) {
      document.getElementById(id).disabled = on;
    }
  }

  document.querySelector("#save-token").onclick = () => {
    token = document.querySelector("#token").value.trim();
    if (!token) return;
    localStorage.setItem(TOKEN_KEY, token);
    document.querySelector("#token").value = "";
    show("app");
    outcome = "";
    showError("");
    say("");
    paint();
  };

  document.querySelector("#forget").onclick = () => {
    localStorage.removeItem(TOKEN_KEY);
    token = "";
    clearSelection();
    show("setup");
  };

  clearButton.onclick = () => {
    if (busy || recording) return;
    clearSelection();
    paint();
  };

  document.querySelector("#photo").onclick = () => camera.click();
  document.querySelector("#library").onclick = () => files.click();

  camera.onchange = () => {
    const file = camera.files && camera.files[0];
    camera.value = "";
    if (file) holdPhoto(file, "camera");
  };

  files.onchange = () => {
    const file = files.files && files.files[0];
    files.value = "";
    if (file) holdPhoto(file, "files");
  };

  document.querySelector("#note-open").onclick = () => {
    composer.classList.toggle("hidden");
    if (!composer.classList.contains("hidden")) noteBox.focus();
  };

  document.querySelector("#clip-open").onclick = () => {
    clipper.classList.toggle("hidden");
    if (!clipper.classList.contains("hidden")) clipBox.focus();
  };

  clipBox.addEventListener("input", () => {
    if (outcome) {
      const url = clipBox.value;
      clearSelection();
      clipBox.value = url;
      clipper.classList.remove("hidden");
    }
    showError("");
    paint();
  });

  noteBox.addEventListener("input", () => {
    if (outcome) return;
    showError("");
    paint();
  });

  uploadButton.onclick = async () => {
    if (outcome === "error") {
      clearSelection();
      paint();
      return;
    }
    if (!ready() || recording || busy) return;
    busy = true;
    lock(true);
    showError("");
    paint();
    say("Sending…");
    try {
      if (photoFile) await sendPhoto(photoFile);
      const text = noteBox.value.trim();
      const url = clipValue();
      if (url) await sendClip(url, text);
      else if (text) await sendNote(text);
      if (voiceTake) await sendVoice(voiceTake);
      clearSelection();
      say("Sent.");
    } catch (error) {
      outcome = "error";
      say("");
      showError(shortError(error));
    } finally {
      busy = false;
      lock(false);
      paint();
    }
  };

  voiceButton.onclick = async () => {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (error) {
      say("The microphone is blocked.");
      return;
    }
    const mime = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "audio/webm";
    chunks = [];
    recorder = new MediaRecorder(stream, { mimeType: mime });
    recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach((track) => track.stop());
      recording = false;
      if (outcome) clearSelection();
      voiceButton.classList.remove("recording");
      voiceButton.setAttribute("aria-label", "Record voice");
      voiceButton.querySelector(".material-symbols-outlined").textContent = "mic";
      const blob = new Blob(chunks, { type: mime });
      voiceTake = { blob, ext: mime === "audio/mp4" ? "m4a" : "webm" };
      outcome = "";
      showError("");
      recorder = null;
      say("Voice ready.");
      paint();
    };
    recorder.start();
    recording = true;
    voiceButton.classList.add("recording");
    voiceButton.setAttribute("aria-label", "Stop recording");
    voiceButton.querySelector(".material-symbols-outlined").textContent = "stop_circle";
    say("Recording…");
    paint();
  };

  show(token ? "app" : "setup");
  paint();
</script>
</body>
</html>
